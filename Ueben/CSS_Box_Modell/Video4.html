<style>
  .subscribe-button {
    background-color: rgb(201, 0, 0);
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-right: 8px;
    padding-left: 16px;
    padding-right: 16px;
    padding-bottom: 10px;
    padding-top: 10px;
    transition: opacity 0.15s;
    vertical-align: top; /* Wenn der Button nicht mit den anderen gleichhält liegt das daran, da die Texte bei default auf gleicher höhe sein wollen, um die ränder gleich zu bekommen muss man vertical-align machen*/
  }

  .subscribe-button:hover {
    opacity: 0.8;
  }

  .subscribe-button:active {
    opacity: 0.4;
  }

  .join-button {
    background-color: white;
    color: rgb(41, 118, 211);
    border-style: solid;
    border-width: 1px;
    border-color: rgb(41, 118, 211);
    border-radius: 2px;
    cursor: pointer;
    padding-left: 16px; /* Padding besser als height und width da alles dann automatisch angepasst wird mit dem neuen text was zum button dazu kommt*/
    padding-right: 16px;
    padding-bottom: 9px; /* Hier 1px weniger wegen den ränder bzw. weil der join button trotzdem etwas größer wirkte*/
    padding-top: 9px;
    transition:
      background-color 0.15s,
      color 0.15s;
  }
  .join-button:hover {
    background-color: rgb(41, 118, 211);
    color: white;
  }

  .join-button:active {
    opacity: 0.7;
  }

  .tweet-button {
    background-color: rgb(41, 118, 211);
    color: white;
    border-style: solid;
    border-width: 1px;
    border-color: rgb(41, 118, 211);
    height: 36px;
    width: 74px;
    border-radius: 18px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
    margin-left: 8px;
    vertical-align: top;
    transition:
      box-shadow 0.15s,
      color 0.15s;
  }

  .tweet-button:hover {
    box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
  }
</style>

<button class="subscribe-button">SUBSCRIBE</button>
<button class="join-button">JOIN</button>
<button class="tweet-button">Tweet</button>
