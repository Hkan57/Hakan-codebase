<!doctype html>
<html>
  <head>
    <title>Document</title>
  </head>
  <body>
    <script>
      function countWords(words) {
        let result = [];

        for (let i = 0; i < words.length; i++) {
          let word = words[i];

          if (!result[word]) {
            result[word] = 1;
          } else {
            result[word]++;
          }
        }
        return result;
      }
      console.log(
        countWords(["apple", "grape", "apple", "grape", "grape", "apple"]),
      );
    </script>
  </body>
</html>
