<!doctype html>
<html>
  <head>
    <title>Testo</title>
    <style>
      .placeholder {
        border: none;
        font-family:Arial;
        vertical-align: middle;
        padding-top: 12px;
        padding-bottom: 12px;
        font-size: 18px;
        width: 300px;
      }

      .cat {
        border-radius: 25px;
        height: 50px;
        width: 50px;
        vertical-align: middle;
        object-fit:cover;
        margin-right: 5px;
      }
      .tweet-btn {
        background-color: rgb(41, 118, 211);
        color: white;
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 16px;
        padding-right: 16px;
        font-weight: bold;
        border-radius: 30px;
        font-size: 16px;
        border: none;
        vertical-align: middle;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img
      class="cat"
      src="/Ueben/HTML_CSS_Learning/CSS_Images_and_Text_Boxes_Lesson_7/thumbnails/cat.jpg"
      "
    />
    <input class="placeholder" placeholder="What's happening?" />
    <button class="tweet-btn">Tweet</button>
  </body>
</html>
