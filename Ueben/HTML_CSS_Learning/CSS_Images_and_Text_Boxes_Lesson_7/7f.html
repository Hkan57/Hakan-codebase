<!doctype html>
<html>
  <head>
    <title>Testo</title>

    <style>
      p {
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
        color: grey;
      }
      .email {
        font-size: 14px;
        margin-bottom: 5px;
      }
      .input {
        padding-right: 200px;
        border-style: solid;
        border-width: 1px;
        padding-bottom: 5px;
        padding-top: 5px;
      }
      .agreement {
        font-size: 14px;
        margin-top: 20px;
      }
      .join-btn {
        margin-top: 20px;
        background-color: rgba(29, 84, 238, 0.897);
        color: white;
        border-radius: 30px;
        border: none;
        text-align: center;
        padding-left: 150px;
        padding-right: 150px;
        padding-top: 15px;
        padding-bottom: 15px;
        cursor: pointer;
        /*oder statt left und right border-width: 300px oder so;*/
      }
      .join-btn:active {
        background-color: rgb(26, 24, 172);
      }
    </style>
  </head>

  <body>
    <p class="email">Email</p>
    <input class="input" />
    <p class="agreement">
      By clicking Agree & Join, you agree to the Privacy Policy.
    </p>
    <button class="join-btn">Agree & Join</button>
  </body>
</html>
