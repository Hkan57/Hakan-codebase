<!doctype html>
<html>
  <head>
    <title>Youtube.com Clone</title>

    <style>
      .thumbnail {
        width: 300px;
        display: inline-block;
      }
      .search-bar {
        display: inline-block;
        font-size: 20px;
      }
      .video-title {
        margin-top: 0;
      }

      .video-preview {
        display: inline-block;
        width: 300px;
        vertical-align: top;
        margin-right: 10px;
      }
      .channel-picture {
        display: inline-block;
        width: 50px;
        vertical-align: top;
      }
      .video-info {
        display: inline-block;
        width: 200px;
      }
      .channel {
        width: 100%; /* nimmt 50 px weil oben das in dem div eingestellt wurde also das maximale*/
        border-radius: 25px;
      }
    </style>
  </head>
  <body>
    <input class="search-bar" type="text" placeholder="Search" />
    <div>
      <div class="video-preview">
        <img class="thumbnail" src="thumbnails/thumbnail-1.webp" />
      </div>
      <div>
        <div class="channel-picture">
          <img class="channel" src="thumbnails/channel-1.jpeg" />
        </div>
        <div class="video-info">
          <p class="video-title">
            Talking Tech <strong>and AI with</strong> Google CEO Sundar Pichai!
          </p>
          <p class="video-author">Marques Brownlee</p>
          <p class="video-stats">3.4M views &#183; 6 months ago</p>
        </div>
      </div>
    </div>

    <div class="video-preview">
      <img class="thumbnail" src="thumbnails/thumbnail-2 (1).webp" />
      <p class="video-title">Try Not To Laugh Challenge #9</p>
      <p class="video-author">Markiplier</p>
      <p class="video-stats">19M views &#183; 4 years ago</p>
    </div>
  </body>
</html>
